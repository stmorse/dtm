# Copy to config.ini (gitignored) in the repo root. Scripts read ../config.ini, so run them from src/.
# Paths below are the sciclone locations as seen from cm pods / sciclone nodes.

[general]
# raw Pushshift dumps RC_YYYY-MM.{bz2,xz,zst}
data_path  = /sciclone/data10/twford/reddit/reddit/comments
# embeddings_YYYY-MM.zarr
embed_path = /sciclone/proj-ds/geograd/stmorse/reddit/embeddings
# unused (metadata not currently saved by 1_embed.py)
meta_path  = /sciclone/proj-ds/geograd/stmorse/reddit/metadata
# root for results; scripts write to save_path/<subpath>/...
save_path  = /sciclone/proj-ds/geograd/stmorse/reddit
# HF_HOME for sentence-transformers model cache
hf_path    = /sciclone/home/stmorse/.cache/huggingface

[embed]
chunk_size = 1000000
hf_model   = sentence-transformers/all-MiniLM-L6-v2
